{% load static %}
<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Sin conexión - Gestor de Pedidos y Catering</title>
      <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}"/>
      <link rel="stylesheet" href="{% static 'css/all.min.css' %}"/>
      <style>
         body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a1a;color:#fff;text-align:center;padding:24px;font-family:system-ui,sans-serif;}
         .ico{width:96px;height:96px;margin:0 auto 24px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8281a,#f6a623);font-size:44px;}
      </style>
   </head>
   <body>
      <div>
         <div class="ico"><i class="fas fa-wifi"></i></div>
         <h1 class="h3 mb-3">Sin conexión</h1>
         <p class="text-white-50 mb-4">
            Esta aplicación necesita internet para consultar los pedidos,
            menús y eventos. Revisa tu conexión e inténtalo de nuevo.
         </p>
         <button class="btn btn-danger px-4" onclick="location.reload()">
            <i class="fas fa-rotate-right me-2"></i>Reintentar
         </button>
      </div>
   </body>
</html>
