{% extends "plantillaprincipal.html" %}
{% load static %}

{% block contenido %}
<section class="py-5">
    <div class="container">

        <div class="text-center mb-5">
            <span class="slbl">Personal de cocina</span>

            {% if cocinero %}
                <h2 class="stitle">
                    Editar <span>cocinero</span>
                </h2>
            {% else %}
                <h2 class="stitle">
                    Registrar <span>cocinero</span>
                </h2>
            {% endif %}

            <div class="sline"></div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">

                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-lg-5">

                        {% if cocinero %}
                            <form id="form_cocinero" action="/actualizarCocinero/{{ cocinero.id }}/" method="post">
                        {% else %}
                            <form id="form_cocinero" action="/guardarCocinero/" method="post">
                        {% endif %}

                            {% csrf_token %}

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="flbl">
                                        Nombres completos
                                    </label>

                                    <input type="text" name="nombres" class="fctrl" value="{{ cocinero.nombres|default:'' }}" placeholder="Ingrese los nombres" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="flbl">
                                        Identificación
                                    </label>

                                    <input type="text" name="identificacion" class="fctrl" value="{{ cocinero.identificacion|default:'' }}" placeholder="Cédula" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="flbl">
                                        Teléfono
                                    </label>

                                    <input type="text" name="telefono" class="fctrl" value="{{ cocinero.telefono|default:'' }}" placeholder="Número telefónico">
                                </div>

                                <div class="col-md-6">
                                    <label class="flbl">
                                        Especialidad
                                    </label>

                                    <input type="text" name="especialidad" class="fctrl" value="{{ cocinero.especialidad|default:'' }}" placeholder="Ejemplo: Repostería">
                                </div>

                                <div class="col-12">
                                    <div class="form-check">

                                        <input type="checkbox" name="activo" class="form-check-input" id="activoCocinero" {% if not cocinero or cocinero.activo %}checked{% endif %}>

                                        <label class="form-check-label" for="activoCocinero">
                                            Cocinero activo
                                        </label>

                                    </div>
                                </div>

                                <div class="col-12">
                                    <hr>
                                </div>

                                <div class="col-12 d-flex justify-content-center gap-2 flex-wrap">

                                    <button type="submit" class="btn-red">
                                        <i class="fas fa-save"></i>
                                        Guardar cocinero
                                    </button>

                                    <a href="/cocineros/" class="btn btn-secondary px-4">
                                        <i class="fas fa-times"></i>
                                        Cancelar
                                    </a>

                                </div>

                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</section>
{% endblock %}
