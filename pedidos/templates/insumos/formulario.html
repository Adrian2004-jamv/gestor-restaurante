{% extends "plantillaprincipal.html" %}
{% load static %}

{% block contenido %}

<section class="py-5">
    <div class="container">

        <div class="text-center mb-5">
            <span class="slbl">Inventario de cocina</span>

            {% if insumo %}
                <h2 class="stitle">Editar <span>insumo</span></h2>
            {% else %}
                <h2 class="stitle">Registrar <span>insumo</span></h2>
            {% endif %}

            <div class="sline"></div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="panel-formulario">

                    {% if insumo %}
                        <form class="form_validar" id="form_insumo" action="/actualizarInsumo/{{ insumo.id }}/" method="post">
                    {% else %}
                        <form class="form_validar" id="form_insumo" action="/guardarInsumo/" method="post">
                    {% endif %}

                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-8">
                                <label class="flbl">Nombre del insumo</label>
                                <input type="text" name="nombre" class="fctrl" value="{{ insumo.nombre|default:'' }}" placeholder="Ejemplo: Arroz, pollo, aceite" required>
                            </div>

                            <div class="col-md-4">
                                <label class="flbl">Unidad de medida</label>
                                <select name="unidad_medida" class="fctrl" required>
                                    <option value="">Seleccione</option>
                                    <option value="KG" {% if insumo.unidad_medida == "KG" %}selected{% endif %}>Kilogramos</option>
                                    <option value="G" {% if insumo.unidad_medida == "G" %}selected{% endif %}>Gramos</option>
                                    <option value="L" {% if insumo.unidad_medida == "L" %}selected{% endif %}>Litros</option>
                                    <option value="ML" {% if insumo.unidad_medida == "ML" %}selected{% endif %}>Mililitros</option>
                                    <option value="UND" {% if insumo.unidad_medida == "UND" %}selected{% endif %}>Unidades</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="flbl">Costo unitario</label>
                                <input type="number" name="costo_unitario" class="fctrl" value="{{ insumo.costo_unitario|default:'0.00' }}" min="0" step="0.01" placeholder="0.00" required>
                            </div>

                            <div class="col-md-4">
                                <label class="flbl">Stock actual</label>
                                <input type="number" name="stock_actual" class="fctrl" value="{{ insumo.stock_actual|default:'0.00' }}" min="0" step="0.01" placeholder="0.00" required>
                            </div>

                            <div class="col-md-4">
                                <label class="flbl">Stock mínimo</label>
                                <input type="number" name="stock_minimo" class="fctrl" value="{{ insumo.stock_minimo|default:'0.00' }}" min="0" step="0.01" placeholder="0.00" required>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" name="activo" class="form-check-input" id="activoInsumo" {% if not insumo or insumo.activo %}checked{% endif %}>
                                    <label class="form-check-label" for="activoInsumo">Insumo activo</label>
                                </div>
                            </div>

                            <div class="col-12 d-flex gap-2 mt-4">
                                <button type="submit" class="btn-red"><i class="fas fa-save"></i> Guardar insumo</button>
                                <a href="/insumos/" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>

                        </div>

                    </form>

                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}
